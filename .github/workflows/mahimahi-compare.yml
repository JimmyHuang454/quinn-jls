name: Mahimahi Comparison (copa-auto vs Mortise)

on:
  push:
    branches: ['codex/mahimahi-*']
    paths:
      - .github/workflows/mahimahi-compare.yml
      - scripts/install_mahimahi.sh
      - scripts/mahimahi_eval.py
      - scripts/mahimahi_rct.py
      - scripts/run_mahimahi_suite.py
      - perf/src/client.rs
  workflow_dispatch:
    inputs:
      mode:
        description: "Quick checks LTE; rct compares download tail latency on LTE at 2 MB; datasets checks new bulk traces."
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - rct
          - smoke
          - full
          - nyc-subway
          - lumos-5g
          - leo
          - datasets
      theta:
        description: "Theta in [0.01, 0.99] for the competitive and NC Copa-auto variants"
        required: true
        default: "0.98"
        type: string
      run_mortise:
        description: "Also build and run official BobAnkh/Mortise in parallel"
        required: true
        default: true
        type: boolean
      send_fairness:
        description: "quinn TransportConfig::send_fairness (false = FIFO across concurrent streams like single-TCP)"
        required: true
        default: false
        type: boolean
      stream_receive_window:
        description: "quinn --stream-receive-window (e.g. 8M avoids 1.25M flow-control interleaving on app.wk)"
        required: false
        default: "8M"
        type: string

concurrency:
  group: mahimahi-compare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.matrix.outputs.mode }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          MODE: ${{ inputs.mode || (github.ref_name == 'codex/mahimahi-rct' && 'rct') || 'datasets' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          mode = os.environ['MODE']
          shards = {
              'quick': ['smoke'],
              'rct': ['smoke'],
              'full': ['lte', 'nyc-stat', 'nyc-walk-1', 'nyc-walk-2', 'nyc-walk-3',
                       'nyc-drive-1', 'nyc-drive-2', 'synth', 'nyc-subway', 'lumos-5g'],
              'datasets': ['nyc-subway', 'lumos-5g', 'leo'],
          }.get(mode, [mode])
          include = []
          for shard in shards:
              if mode == 'rct':
                  workloads = ['app']
              else:
                  workloads = ['bulk'] if mode == 'datasets' or shard == 'leo' else ['bulk', 'app']
              for workload in workloads:
                  include.append({'shard': shard, 'workload': workload})
          print('matrix=' + json.dumps({'include': include}))
          print('mode=' + mode)
          PY

  quinn-eval:
    name: quinn (${{ matrix.shard }}, ${{ matrix.workload }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout quinn-jls
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Mahimahi (pruned) & dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            autotools-dev autoconf libtool libssl-dev xcb \
            libxcb-composite0-dev libxcb-present-dev libcairo2-dev \
            libpango1.0-dev dnsmasq iproute2 python3 curl
          bash scripts/install_mahimahi.sh "${{ matrix.shard }}"

      - name: Build quinn-perf
        run: cargo build --release -p perf

      - name: Prepare workloads
        run: |
          mkdir -p /tmp/workloads
          curl -fsSL --retry 3 -o /tmp/workloads/app.wk \
            "https://raw.githubusercontent.com/BobAnkh/Mortise/main/mortise/workload/app.wk"
          python3 -c 'print("\n".join(["0\t2097152"] * 200))' > /tmp/workloads/bulk.wk

      - name: Run quinn-perf Mahimahi suite (${{ matrix.shard }})
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          THETA: ${{ inputs.theta || '0.98' }}
          SHARD: ${{ matrix.shard }}
          WORKLOAD: ${{ matrix.workload }}
          SEND_FAIRNESS: ${{ inputs.send_fairness && 'true' || 'false' }}
          STREAM_RECEIVE_WINDOW: ${{ inputs.stream_receive_window || '8M' }}
        run: |
          BULK_SECS=45
          APP_SECS=200
          CCS="copa-auto,copa-auto-nc,copa-auto-theta${THETA},copa-auto-nc-theta${THETA},copa,bbr1,cubic"
          QUEUES="150000,2000000"
          PARALLEL=4
          if [ "$SHARD" = "smoke" ]; then BULK_SECS=30; fi
          if [ "$MODE" = "quick" ] || [ "$MODE" = "datasets" ]; then
            CCS="copa,copa-auto,copa-auto-theta${THETA}"
            QUEUES="150000"
          fi
          if [ "$MODE" = "rct" ]; then
            CCS="copa-auto,copa-auto-theta0.9,copa-auto-theta0.98"
            QUEUES="2000000"
            APP_SECS=260
            export RUST_LOG="warn,quinn_proto::congestion::copa=debug"
          fi
          EXTRA_ARGS=()
          if [ "$SHARD" = "lumos-5g" ]; then
            QUEUES="2000000,16000000"
            PARALLEL=2
            EXTRA_ARGS+=(--connection-window 64M)
            if [ "$MODE" = "datasets" ]; then QUEUES="2000000"; fi
          fi
          if [ "$SHARD" = "leo" ]; then
            BULK_SECS=115
            QUEUES="2000000,75000000"
            PARALLEL=2
            EXTRA_ARGS+=(--connection-window 64M)
            if [ "$MODE" = "datasets" ]; then QUEUES="2000000"; fi
          fi
          if [ -n "$STREAM_RECEIVE_WINDOW" ]; then
            EXTRA_ARGS+=(--stream-receive-window "$STREAM_RECEIVE_WINDOW")
          fi
          python3 scripts/run_mahimahi_suite.py \
            --stack quinn \
            --shard "$SHARD" \
            --ccs "$CCS" \
            --queues "$QUEUES" \
            --workloads "$WORKLOAD" \
            --bulk-secs "$BULK_SECS" \
            --app-secs "$APP_SECS" \
            --send-fairness "$SEND_FAIRNESS" \
            "${EXTRA_ARGS[@]}" \
            --parallel "$PARALLEL" \
            --bin ./target/release/quinn-perf \
            --trace-dir /tmp/traces \
            --app-workload /tmp/workloads/app.wk \
            --bulk-workload /tmp/workloads/bulk.wk \
            --out-dir /tmp/quinn_out

      - name: Upload quinn-jls shard results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: results-quinn-${{ matrix.shard }}-${{ matrix.workload }}
          path: /tmp/quinn_out

  mortise-eval:
    name: mortise (${{ matrix.shard }}, ${{ matrix.workload }})
    needs: plan
    if: ${{ github.event_name == 'push' || inputs.run_mortise }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout quinn-jls (for runner & parser scripts)
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Clone BobAnkh/Mortise
        run: git clone --depth 1 https://github.com/BobAnkh/Mortise.git /tmp/Mortise

      - name: Install Mahimahi, eBPF toolchain, and Python deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            autotools-dev autoconf libtool libssl-dev xcb \
            libxcb-composite0-dev libxcb-present-dev libcairo2-dev \
            libpango1.0-dev dnsmasq iproute2 \
            clang llvm libbpf-dev libelf-dev dwarves pkg-config \
            build-essential python3-pip python3-venv curl \
            linux-tools-common "linux-tools-$(uname -r)" || \
            sudo apt-get install -y -qq linux-tools-generic || true

          sudo modprobe tcp_bbr || true
          sudo sysctl -w net.ipv4.tcp_allowed_congestion_control="cubic reno bbr" || true

          if ! command -v bpftool >/dev/null 2>&1; then
            BPFTOOL_BIN=$(find /usr/lib/linux-tools* /usr/sbin /usr/bin -name bpftool -type f 2>/dev/null | head -n1 || true)
            if [ -n "$BPFTOOL_BIN" ]; then
              sudo ln -sf "$BPFTOOL_BIN" /usr/local/bin/bpftool
            fi
          fi
          bpftool version || true

          bash scripts/install_mahimahi.sh "${{ matrix.shard }}"

          sudo mkdir -p /home/vagrant
          sudo chown "$(id -u):$(id -g)" /home/vagrant
          python3 -m venv /home/vagrant/mortise-venv
          source /home/vagrant/mortise-venv/bin/activate
          pip install -q numpy structlog scipy pandas
          ln -sfn /tmp/Mortise/algorithm /home/vagrant/algorithm

      - name: Build Mortise BPF object and Rust binaries
        run: |
          uname -r
          cd /tmp/Mortise/algorithm/bpf-kern
          rm -f include/vmlinux.h
          make vmlinux
          python3 - << 'PY'
          import pathlib, re
          vml = pathlib.Path("include/vmlinux.h").read_text(errors="ignore")
          m = re.search(r"struct\s+tcp_congestion_ops\s*\{(.*?)\};", vml, re.S)
          assert m, "struct tcp_congestion_ops not found in vmlinux.h"
          for line in m.group(1).splitlines():
              if "cong_control" in line:
                  print("Kernel cong_control signature:", line.strip())
          if re.search(r"\(\*cong_control\)\s*\([^)]*u32[^)]*int[^)]*rate_sample", m.group(1)):
              p = pathlib.Path("mortise_copa.bpf.c")
              src = p.read_text()
              old = "BPF_PROG(bpf_copa_main, struct sock *sk, const struct rate_sample *rs)"
              new = "BPF_PROG(bpf_copa_main, struct sock *sk, u32 ack, int flag, const struct rate_sample *rs)"
              assert old in src, "expected bpf_copa_main signature not found"
              p.write_text(src.replace(old, new, 1))
              print("Patched bpf_copa_main for 4-arg cong_control ABI (Linux >= 6.10)")
          else:
              print("Keeping 2-arg bpf_copa_main ABI")
          PY
          make build/mortise_copa.bpf.o
          cd /tmp/Mortise/mortise
          cargo build --release -p mortise-manager -p traffic

          cd /tmp/Mortise/algorithm/kern-mod
          if make && sudo make install; then
            echo "COPA_KMOD=1" >> "$GITHUB_ENV"
          else
            echo "WARN: kern-mod copa skipped on kernel $(uname -r)"
            echo "COPA_KMOD=0" >> "$GITHUB_ENV"
          fi

      - name: Run Mortise Mahimahi suite (${{ matrix.shard }})
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          SHARD: ${{ matrix.shard }}
          WORKLOAD: ${{ matrix.workload }}
        run: |
          set -euo pipefail
          OUT="/tmp/mortise_out"
          mkdir -p "$OUT" /tmp/workloads
          cp /tmp/Mortise/mortise/workload/app.wk /tmp/workloads/app.wk
          python3 -c 'print("0\t2097152\n" * 8192, end="")' > /tmp/workloads/bulk.wk
          BULK_SECS=45
          APP_SECS=200
          QUEUES="150000,2000000"
          PARALLEL=4
          if [ "$SHARD" = "smoke" ]; then BULK_SECS=30; fi
          if [ "$MODE" = "quick" ] || [ "$MODE" = "datasets" ]; then QUEUES="150000"; fi
          if [ "$MODE" = "rct" ]; then
            QUEUES="2000000"
            APP_SECS=260
          fi
          if [ "$SHARD" = "lumos-5g" ]; then
            QUEUES="2000000,16000000"
            PARALLEL=2
            if [ "$MODE" = "datasets" ]; then QUEUES="2000000"; fi
          fi
          if [ "$SHARD" = "leo" ]; then
            BULK_SECS=115
            QUEUES="2000000,75000000"
            PARALLEL=2
            if [ "$MODE" = "datasets" ]; then QUEUES="2000000"; fi
          fi

          RUNNER_SCRIPT="$PWD/scripts/run_mahimahi_suite.py"
          cd /tmp/Mortise/mortise

          source /home/vagrant/mortise-venv/bin/activate
          LOG_LEVEL=warn python3 process-report.py > "$OUT/process_report.log" 2>&1 &
          PY_PID=$!
          sleep 2

          RUST_LOG=info sudo -E ./target/release/manager > "$OUT/manager.log" 2>&1 &
          MGR_PID=$!
          for _ in $(seq 1 20); do
            [ -S /tmp/mortise.sock ] && break
            sleep 1
          done
          sleep 2

          cat "$OUT/manager.log"
          if grep -q "Fail to load" "$OUT/manager.log" || ! grep -q "Load mortise_copa" "$OUT/manager.log"; then
            echo "::error::mortise_copa BPF failed to load: $(tail -n 4 "$OUT/manager.log" | tr '\n' ' ')"
            exit 1
          fi

          ./target/release/server > "$OUT/server.log" 2>&1 &
          SRV_PID=$!
          sleep 2

          CCS="mortise_copa,bbr,cubic"
          if [ "$MODE" = "quick" ] || [ "$MODE" = "datasets" ] || [ "$MODE" = "rct" ]; then
            CCS="mortise_copa"
          elif [ "${COPA_KMOD:-0}" = "1" ]; then
            CCS="${CCS},copa"
          fi

          python3 "$RUNNER_SCRIPT" \
            --stack mortise \
            --shard "$SHARD" \
            --ccs "$CCS" \
            --queues "$QUEUES" \
            --workloads "$WORKLOAD" \
            --bulk-secs "$BULK_SECS" \
            --app-secs "$APP_SECS" \
            --parallel "$PARALLEL" \
            --bin ./target/release/client \
            --trace-dir /tmp/traces \
            --app-workload /tmp/workloads/app.wk \
            --bulk-workload /tmp/workloads/bulk.wk \
            --out-dir "$OUT"

          kill "$SRV_PID" "$PY_PID" 2>/dev/null || true
          sudo kill "$MGR_PID" 2>/dev/null || true

      - name: Upload Mortise shard results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: results-mortise-${{ matrix.shard }}-${{ matrix.workload }}
          path: /tmp/mortise_out

  summarize:
    name: Unified Comparison Summary
    needs: [plan, quinn-eval, mortise-eval]
    if: ${{ !cancelled() && (needs.quinn-eval.result != 'skipped' || needs.mortise-eval.result != 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout quinn-jls
        uses: actions/checkout@v4

      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: /tmp/all_results

      - name: Analyze and write summary
        env:
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          mkdir -p /tmp/summary
          python3 scripts/mahimahi_eval.py \
            --input-dir /tmp/all_results \
            --out-csv /tmp/summary/comparison_summary.csv \
            --out-md /tmp/summary/comparison_summary.md \
            --min-rtt-ms 20.0 \
            --bulk-warmup-s 5.0
          cat /tmp/summary/comparison_summary.md >> "$GITHUB_STEP_SUMMARY"
          EXTRA_ARGS=()
          if [ "$MODE" = "rct" ]; then EXTRA_ARGS+=(--print-summary); fi
          python3 scripts/mahimahi_rct.py --input-dir /tmp/all_results --out-dir /tmp/summary \
            "${EXTRA_ARGS[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unified comparison summary
        uses: actions/upload-artifact@v4
        with:
          name: comparison-summary
          path: /tmp/summary
